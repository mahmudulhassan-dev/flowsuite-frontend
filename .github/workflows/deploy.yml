name: FlowSuite Frontend Auto-Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Frontend to VPS (suite.amanasuite.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH VPS Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '148.230.98.190'
          username: 'root'
          password: ${{ secrets.VPS_ROOT_PASSWORD }}
          port: 22
          script: |
            cd /www/wwwroot/suite.amanasuite.com
            git pull origin main || true
            npm install
            npm run build
            pm2 restart flowsuite-frontend || pm2 start npm --name flowsuite-frontend -- start
            pm2 save
